<html>
    <head>
        <link rel="stylesheet" type="text/css" href="style.css">
    </head>
    <body>
        <label for="weather">What's the weather like?</label>
        <select id="weather">
            <option value="sunny">sunny</option>
            <option value="windy">windy</option>
            <option value="rainy">rainy</option>
            <option value="snowy">snowy</option>
            <option value="cloudy">cloudy</option>
        </select>
        <a href="#" onclick="btnPressed()">GO!</a>
        <P id="outputText">Weather advice : </P>
        <script>
            function btsPressed(){
                var weatherSelected = document.getElementById("weather").values;
                var advice;
                
                
                swicth(weatherSelected){
                    case "sunny":
                    advice = "Wear sun glasses";
                    break;
                    case "windy":
                    advice = "Wear a jacket";
                    break;
                    case "rainy":
                    advice = "Wear a rain coat and carry an umbrella";
                    break;
                    case "snowy":
                    advice = "Wear warmly";
                    break;
                    case "cloudy":
                    advice = "Carry a jacket. It might rain";
                    break;
                    
                }
                document.getElementById("outputText").innerHTML = "Weather advice" + advice;
            }
               
            
        </script>           
    </body>
</html>
